[project]
name = "plandaction"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "redel-byte", email = "ridouanelhabib1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fg-data-profiling>=4.20.0",
    "matplotlib>=3.11.2",
    "missingno>=0.5.2",
    "numpy>=2.5.4",
    "pandas>=2.3.3",
    "plotly>=7.1.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
]

[project.scripts]
plandaction = "plandaction:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
